services:
  postgres:
    image: postgres:16
    container_name: new-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-agent}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-agent_dev_password}
    ports:
      - "${AGENT_POSTGRES_PORT:-5434}:5432"
    volumes:
      - ../data/runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: new-agent-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6335}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - ../data/runtime/qdrant:/qdrant/storage

